name: Update prices

on:
  schedule:
    - cron: "0 3 */2 * *"   # every 2 days at 03:00 UTC (08:30 India time)
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh prices from vendor pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python updater/update_prices.py

      - name: Save changes
        run: |
          if git diff --quiet -- prices.json; then
            echo "No price changes."
          else
            git config user.name "atlas-bot"
            git config user.email "atlas-bot@users.noreply.github.com"
            git add prices.json changes.md
            git commit -m "Update prices $(date -u +%F)"
            git push
          fi
